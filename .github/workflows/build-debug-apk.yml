name: Build Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - claude/check-recent-changes-g3dy17
    paths:
      - '.github/workflows/build-debug-apk.yml'

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Java ────────────────────────────────────────────────────────────────
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      # ── Android NDK ─────────────────────────────────────────────────────────
      - name: Setup Android NDK
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;27.1.12297006"

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      # ── Build unsigned debug APK (no signing secrets needed) ───────────────
      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kittytune-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      # ── Commit the APK into the repo (the sandbox this session runs in can't
      #    reach dl.google.com or Azure Blob Storage to build/download it itself) ──
      - name: Commit APK to repo
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/*.apk dist/kittytune-debug.apk
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f dist/kittytune-debug.apk
          if git diff --staged --quiet; then
            echo "APK unchanged, nothing to commit"
            exit 0
          fi
          git commit -m "ci: update debug APK build [skip ci]

          Built from ${{ github.sha }}"
          git push origin HEAD:${{ github.ref_name }}
